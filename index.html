<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday Sushmita</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Arial', sans-serif;
}

body{
  min-height:100vh;
  overflow:hidden;
  background:linear-gradient(
    to bottom,
    #9ddcff,
    #dff5ff,
    #ffffff
  );
}


/* dreamy clouds */

.cloud{
  position:absolute;
  background:white;
  width:180px;
  height:60px;
  border-radius:50px;
  opacity:0.7;
  filter:blur(2px);
  animation:moveCloud 20s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud:before{
  width:80px;
  height:80px;
  left:25px;
  top:-40px;
}

.cloud:after{
  width:100px;
  height:100px;
  right:25px;
  top:-50px;
}


.cloud1{
  top:20%;
  left:-200px;
}

.cloud2{
  top:60%;
  left:-300px;
  animation-delay:8s;
}


@keyframes moveCloud{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(130vw);
  }
}


/* stars */

.star{
  position:absolute;
  color:white;
  font-size:25px;
  animation:shine 2s infinite;
}


@keyframes shine{
  50%{
    opacity:0.3;
    transform:scale(1.3);
  }
}


/* main card */

.card{
  position:relative;
  z-index:5;
  width:85%;
  max-width:500px;
  margin:120px auto;
  padding:35px;
  text-align:center;

  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(10px);

  border-radius:25px;

  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}


h1{
  color:#4aa9d8;
  font-size:38px;
}


p{
  margin-top:20px;
  color:#555;
  font-size:18px;
}


</style>

</head>

<body>


<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>


<div class="star" style="top:15%;left:15%;">✨</div>
<div class="star" style="top:30%;right:20%;">✨</div>
<div class="star" style="bottom:20%;left:25%;">✨</div>


<div class="card">

<h1>
Happy Birthday Sushmita 💙
</h1>

<p>
A little surprise for someone special ✨
</p>


</div>


</body>
</html>
