<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday</title>

<style>
body {
  background: pink;
  text-align: center;
  font-family: Arial, sans-serif;
}

h1 {
  font-size: 40px;
}

p {
  font-size: 20px;
  color: #444;
}

.balloon {
  font-size: 50px;
  animation: float 2s infinite;
}

@keyframes float {
  0% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-30px);
  }

  100% {
    transform: translateY(0);
  }
}
</style>

</head>

<body>

<h1>🎉 Happy Birthday! 🎂</h1>

<div class="balloon">
🎈🎈🎈🎈🎈
</div>

<h2>Dear Best Friend 💖</h2>

<p>
Wishing you a day full of happiness, love and lots of cake! 🎁✨
</p>

<p>
May all your dreams come true. 🌸
</p>

</body>
</html>
